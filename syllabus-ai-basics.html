<!DOCTYPE html>
<html lang="en">

<meta charset="UTF-8">
<title>Start Smarter | The Vanderbilt Staff Learning Collection</title>

<link rel="canonical" href="syllabus-start-smarter.html">
<!-- Vercel Web Analytics (vercel-analytics): served only by Vercel, so it is skipped on GitHub Pages -->
<script>
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  if (!/(^|\.)github\.io$/.test(location.hostname)) {
    var vaScript = document.createElement('script');
    vaScript.defer = true;
    vaScript.src = '/_vercel/insights/script.js';
    document.head.appendChild(vaScript);
  }
</script>
</head>
<body>
<p>This course is now called Start Smarter. <a href="syllabus-start-smarter.html">Continue to the course description.</a></p>
<script>
  /* Printed syllabi show the course address; resolve it from wherever this site is served
     so the printout is correct on any domain. */
  document.querySelectorAll('a[href]').forEach(function (a) {
    if (/^(me5231979\.github\.io|flh-learning-library\.vercel\.app|https?:\/\/)/.test(a.textContent.trim())) {
      a.textContent = a.href.replace(/^https?:\/\//, '');
    }
  });
</script>
</body>
</html>
